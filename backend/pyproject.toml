[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frp-master-connection"
version = "0.0.0.dev0"
description = "Proprietary FRP Master Connection backend application shell."
requires-python = ">=3.14,<3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
persistence = [
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "hypothesis==6.165.0",
  "httpx==0.28.1",
  "ruff==0.16.1",
  "mypy==2.3.0",
]
tooling = [
  "pip-tools==7.6.0",
  "setuptools==83.0.0",
  "wheel==0.47.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["frp_master_connection*"]
namespaces = false

[tool.setuptools.package-data]
frp_master_connection = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["frp_master_connection"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "I",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
mypy_path = "src"
files = ["src", "tests"]
